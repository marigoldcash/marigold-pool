[workspace]
resolver = "2"
members = [
    "crates/pool-domain",
    "crates/pool-db",
    "crates/pool-accountant",
    "crates/pool-payout",
    "crates/pool-api",
    "crates/pool-chain",
    "crates/marigold-pool",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marigoldcash/marigold-pool"
authors = ["The Marigold developers"]

[workspace.dependencies]
# The node's crates, pinned to one commit of marigoldcash/marigold (PLAN.md
# ground rule 9). Move every line to the same new commit together, never one
# at a time. The crate names are still kaspa-*.
kaspa-stratum-bridge = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-wallet-core = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-wrpc-client = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-grpc-client = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-rpc-core = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-consensus-core = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-addresses = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-pow = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-hashes = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }
kaspa-math = { git = "https://github.com/marigoldcash/marigold", rev = "52c8c50832d9caa72b7ce03630eb5d726ff318f7" }

# The pool's own crates.
pool-domain = { path = "crates/pool-domain" }
pool-db = { path = "crates/pool-db" }
pool-accountant = { path = "crates/pool-accountant" }
pool-payout = { path = "crates/pool-payout" }
pool-api = { path = "crates/pool-api" }
pool-chain = { path = "crates/pool-chain", default-features = false }

# Everything else.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
workflow-core = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
prometheus = "0.14"
tempfile = "3"
